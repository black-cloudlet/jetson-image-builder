# Reusable: build one image variant and turn it into an installer ISO.
#
# A variant is a directory holding Containerfile, config.toml and
# smoke-test.sh. The build context is the repository root, so a variant's
# Containerfile can COPY shared tooling such as physically-bound-images/.
# Callers are thin: .github/workflows/build-<variant>.yml.
#
# Shape borrowed from redhat-et/edge-ai-image-pipelines (Apache-2.0), which
# builds Tegra bootc images the same way: an Ubuntu runner for native aarch64
# with every step inside a UBI container, so podman/buildah/skopeo come from
# RHEL and subscription-manager supplies entitlement. GitHub offers no
# RHEL-hosted runner.
name: build bootc image variant

on:
  workflow_call:
    inputs:
      variant:
        description: directory holding Containerfile, config.toml and smoke-test.sh
        type: string
        required: true
      runs-on:
        description: runner label; must be native aarch64
        type: string
        default: ubuntu-24.04-arm
    outputs:
      tag:
        value: ${{ jobs.image.outputs.tag }}
      image:
        value: ${{ jobs.image.outputs.image }}

jobs:
  image:
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read, packages: write }
    container:
      # --device is the runner's scratch disk: embedded container images do not
      # fit in the job container's writable layer.
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged --device /dev/nvme0n1
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jetson-orin-bootc-${{ inputs.variant }}
      # Use this container's own registration, not the (unsubscribed) host's.
      SMDEV_CONTAINER_OFF: 1
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Container tools
        run: dnf -y install podman buildah skopeo jq

      # UBI's default policy demands signatures for registry.redhat.io content.
      - name: Relax image signature policy in the builder
        run: |
          jq 'del(.transports)' /etc/containers/policy.json > /tmp/policy.json
          mv /tmp/policy.json /etc/containers/policy.json

      - name: Register with Red Hat
        run: subscription-manager register --org="${{ secrets.RHT_ORGID }}" --activationkey="${{ secrets.RHT_ACT_KEY }}"

      - name: Move container storage onto the scratch disk
        run: |
          if findmnt -S /dev/nvme0n1 >/dev/null 2>&1; then
            echo "::warning::/dev/nvme0n1 already mounted; leaving it alone. The build may run out of space."
            exit 0
          fi
          dnf -y install xfsprogs
          mkfs.xfs -f /dev/nvme0n1
          mkdir -p /var/mnt && mount /dev/nvme0n1 /var/mnt
          mkdir -p /var/mnt/containers /var/mnt/tmp /var/lib/containers /var/tmp
          mount --bind /var/mnt/containers /var/lib/containers
          mount --bind /var/mnt/tmp /var/tmp
          df -h /var/lib/containers /var/tmp

      - name: Compute tag
        id: meta
        run: |
          echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pulls the variant's container images at build time; never written into
      # the OS image.
      - name: Write pull secret
        env:
          PULL_SECRET: ${{ secrets.OPENSHIFT_PULL_SECRET }}
        run: |
          install -m 600 /dev/null /tmp/pull-secret.json
          printf '%s' "$PULL_SECRET" > /tmp/pull-secret.json
          jq -e '.auths | length > 0' /tmp/pull-secret.json > /dev/null \
            || { echo "::error::OPENSHIFT_PULL_SECRET is not a pull secret with an .auths object"; exit 1; }

      - name: Build
        run: |
          podman build \
            --secret id=pullsecret,src=/tmp/pull-secret.json \
            -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:latest" \
            -f "${{ inputs.variant }}/Containerfile" .

      - name: Smoke test
        run: podman run --rm -i "$IMAGE:${{ steps.meta.outputs.tag }}" bash -s < "${{ inputs.variant }}/smoke-test.sh"

      - name: Push
        run: podman push "$IMAGE:${{ steps.meta.outputs.tag }}" && podman push "$IMAGE:latest"

      - name: Unregister
        if: always()
        run: subscription-manager unregister || true

  # bib runs nested inside the UBI builder, so unlike on an Ubuntu host it needs
  # the SELinux opt-out as well as --privileged.
  iso:
    needs: image
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read, packages: read }
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged --device /dev/nvme0n1
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      TAG: ${{ needs.image.outputs.tag }}
      ISO_NAME: jetson-orin-bootc-${{ inputs.variant }}-${{ needs.image.outputs.tag }}.iso
      SMDEV_CONTAINER_OFF: 1
    steps:
      - uses: actions/checkout@v4

      - name: Container tools
        run: dnf -y install podman skopeo jq

      - name: Relax image signature policy in the builder
        run: |
          jq 'del(.transports)' /etc/containers/policy.json > /tmp/policy.json
          mv /tmp/policy.json /etc/containers/policy.json

      - name: Register with Red Hat
        run: subscription-manager register --org="${{ secrets.RHT_ORGID }}" --activationkey="${{ secrets.RHT_ACT_KEY }}"

      - name: Move container storage and ISO output onto the scratch disk
        run: |
          if findmnt -S /dev/nvme0n1 >/dev/null 2>&1; then
            echo "::warning::/dev/nvme0n1 already mounted; leaving it alone. The build may run out of space."
            mkdir -p output
            exit 0
          fi
          dnf -y install xfsprogs
          mkfs.xfs -f /dev/nvme0n1
          mkdir -p /var/mnt && mount /dev/nvme0n1 /var/mnt
          mkdir -p /var/mnt/containers /var/mnt/tmp /var/mnt/output /var/lib/containers /var/tmp output
          mount --bind /var/mnt/containers /var/lib/containers
          mount --bind /var/mnt/tmp /var/tmp
          mount --bind /var/mnt/output output
          df -h /var/lib/containers /var/tmp output

      - name: Logins
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}"      | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.RH_REGISTRY_TOKEN }}" | podman login registry.redhat.io -u "${{ secrets.RH_REGISTRY_USER }}" --password-stdin

      - name: Render config.toml
        run: |
          sed -e 's|@EDGE_SSH_PUBKEY@|${{ secrets.EDGE_SSH_PUBKEY }}|' \
              -e 's|@EDGE_PASSWORD_HASH@|${{ secrets.EDGE_PASSWORD_HASH }}|' \
              "${{ inputs.variant }}/config.toml" > /tmp/config.toml
          ! grep -q '@EDGE_' /tmp/config.toml

      - name: Build ISO
        run: |
          podman pull "$IMAGE:$TAG"
          podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /tmp/config.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            registry.redhat.io/rhel9/bootc-image-builder:latest \
            --type anaconda-iso --config /config.toml "$IMAGE:$TAG"
          mv output/bootiso/install.iso "output/$ISO_NAME"
          (cd output && sha256sum ./*.iso > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: jetson-orin-bootc-${{ inputs.variant }}-iso-${{ needs.image.outputs.tag }}
          path: |
            output/*.iso
            output/SHA256SUMS
          retention-days: 7
          compression-level: 0

      - name: Unregister
        if: always()
        run: subscription-manager unregister || true
