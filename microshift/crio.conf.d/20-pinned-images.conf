# Exempts every embedded image from kubelet's image garbage collection, which
# otherwise deletes unused images at 85% disk, and every unused one at once
# under disk pressure. The node has no registry to pull one back from, and the
# copy in /usr returns only at the next boot. copy_embedded_images.sh still
# removes what a new OS image drops: podman does not read CRI-O pins.
#
# Patterns are prefixes (trailing *) of the registries the layers embed from.
# One list for the whole image: a second drop-in that sets pinned_images
# replaces this one, so a layer embedding from another registry appends here.
# No pattern may cover an image the node pulls, which neither kubelet nor the
# prune would ever remove.
[crio.image]
pinned_images = [
	"quay.io/*",
	"registry.redhat.io/*",
	"nvcr.io/*",
]
