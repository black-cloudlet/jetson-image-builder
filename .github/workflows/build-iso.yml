# Reusable: pushed image -> unattended Anaconda installer ISO.
#
# bib runs nested in the UBI builder, so it needs the SELinux opt-out as well as
# --privileged. Entitlement is required here too: anaconda-iso depsolves
# Anaconda from RHEL repos.
name: build installer ISO

on:
  workflow_call:
    inputs:
      image-ref:
        description: image to install, pinned by digest
        type: string
        required: true
      config:
        description: path to the variant's bootc-image-builder config.toml
        type: string
        required: true
      name:
        description: variant name, used for the ISO and artifact filenames
        type: string
        required: true
      tag:
        type: string
        required: true
      runs-on:
        type: string
        default: ubuntu-24.04-arm

jobs:
  iso:
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read, packages: read }
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
      # The runner's ephemeral disk: the embedded images plus a multi-gigabyte
      # ISO do not fit in the job container's writable layer.
      volumes:
        - /mnt:/scratch
    env:
      ISO_NAME: jetson-orin-bootc-${{ inputs.name }}-${{ inputs.tag }}.iso
      SMDEV_CONTAINER_OFF: 1
    steps:
      - uses: actions/checkout@v4

      - name: Container tools
        run: dnf -y install podman skopeo jq

      # UBI's default policy demands signatures for registry.redhat.io content.
      - name: Relax image signature policy in the builder
        run: |
          jq 'del(.transports)' /etc/containers/policy.json > /tmp/policy.json
          mv /tmp/policy.json /etc/containers/policy.json

      - name: Register with Red Hat
        env:
          RHSM_USERNAME: ${{ secrets.RHSM_USERNAME }}
          RHSM_PASSWORD: ${{ secrets.RHSM_PASSWORD }}
        run: subscription-manager register --username="$RHSM_USERNAME" --password="$RHSM_PASSWORD"

      # Same as build-image.yml; the ISO output goes there too for space.
      - name: Put container storage and ISO output on the runner's disk
        run: |
          mkdir -p /scratch/containers /scratch/tmp /scratch/output /var/lib/containers /var/tmp output
          mount --bind /scratch/containers /var/lib/containers
          mount --bind /scratch/tmp /var/tmp
          mount --bind /scratch/output output
          df -h /var/lib/containers
          podman info --format '{{.Store.GraphDriverName}} {{.Store.GraphStatus}}' | tee /tmp/graph
          grep -q 'Native Overlay Diff:true' /tmp/graph \
            || { echo "::error::podman is not on native overlay; layer commits will take minutes each"; exit 1; }

      - name: Logins
        env:
          RH_REGISTRY_USER: ${{ secrets.RH_REGISTRY_USER }}
          RH_REGISTRY_PASSWORD: ${{ secrets.RH_REGISTRY_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$RH_REGISTRY_PASSWORD" | podman login registry.redhat.io -u "$RH_REGISTRY_USER" --password-stdin

      # An empty or plaintext hash still renders a valid kickstart, so a bad secret
      # would surface only as a finished ISO nobody can log into. Fail here instead.
      # env: + bash substitution rather than sed: a quote, a newline or an `&` in a
      # value would break the command or silently mangle what lands in the file.
      - name: Render config.toml
        env:
          JETSON_SSH_PUBKEY: ${{ secrets.JETSON_SSH_PUBKEY }}
          JETSON_PASSWORD_HASH: ${{ secrets.JETSON_PASSWORD_HASH }}
          CONFIG: ${{ inputs.config }}
        run: |
          check() {
            [ -n "$2" ] || { echo "::error::$1 is empty or unset; add it to the repository secrets"; exit 1; }
            case $2 in *[$'\n\r']*) echo "::error::$1 contains a line break; store it as a single line"; exit 1;; esac
          }
          check JETSON_SSH_PUBKEY "$JETSON_SSH_PUBKEY"
          check JETSON_PASSWORD_HASH "$JETSON_PASSWORD_HASH"
          case $JETSON_PASSWORD_HASH in
            \$?*\$?*\$?*) ;;
            *) echo "::error::JETSON_PASSWORD_HASH is not a crypt hash (expected \$6\$salt\$hash from 'openssl passwd -6'); the kickstart says --iscrypted, so a plaintext value can never be logged in with"; exit 1;;
          esac
          case $JETSON_SSH_PUBKEY in
            ssh-*|ecdsa-*|sk-*) ;;
            *) echo "::error::JETSON_SSH_PUBKEY is not an OpenSSH public key; it must be the contents of the .pub file, not a path to it"; exit 1;;
          esac

          # bash 5.2 expands & in the replacement; 5.1 has no such shopt to unset.
          shopt -u patsub_replacement 2>/dev/null || true
          config=$(cat "$CONFIG")
          config=${config//@JETSON_SSH_PUBKEY@/$JETSON_SSH_PUBKEY}
          config=${config//@JETSON_PASSWORD_HASH@/$JETSON_PASSWORD_HASH}
          install -m 600 /dev/null /tmp/config.toml
          printf '%s\n' "$config" > /tmp/config.toml
          if grep -q '@JETSON_' /tmp/config.toml; then
            echo "::error::unsubstituted @JETSON_ placeholder left in $CONFIG"
            exit 1
          fi

      - name: Build ISO
        run: |
          mkdir -p output
          podman pull "${{ inputs.image-ref }}"
          podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /tmp/config.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            registry.redhat.io/rhel9/bootc-image-builder:latest \
            --type anaconda-iso --config /config.toml "${{ inputs.image-ref }}"
          mv output/bootiso/install.iso "output/$ISO_NAME"
          (cd output && sha256sum ./*.iso > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: jetson-orin-bootc-${{ inputs.name }}-iso-${{ inputs.tag }}
          path: |
            output/*.iso
            output/SHA256SUMS
          retention-days: 7
          compression-level: 0

      - name: Unregister
        if: always()
        run: subscription-manager unregister || true
