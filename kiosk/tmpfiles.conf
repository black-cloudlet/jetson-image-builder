# The kiosk user's home, and the script GNOME Kiosk's session runs from it:
# gnome-kiosk-script execs ~/.local/bin/gnome-kiosk-script.
d /var/home/kiosk                                0700 kiosk kiosk -
d /var/home/kiosk/.local                         0755 kiosk kiosk -
d /var/home/kiosk/.local/bin                     0755 kiosk kiosk -
L+ /var/home/kiosk/.local/bin/gnome-kiosk-script -    -     -     - /usr/libexec/jetson-kiosk/gnome-kiosk-script

# The session GDM starts when kiosk logs in.
d /var/lib/AccountsService/users                 0700 root  root  -
f+ /var/lib/AccountsService/users/kiosk          0600 root  root  - [User]\nSession=gnome-kiosk-script-wayland\nSystemAccount=false\n

# Off the login screen: GDM lists every regular user, and the admin account
# has no business next to kiosk there. The kickstart creates it.
f+ /var/lib/AccountsService/users/cloudlet       0600 root  root  - [User]\nSystemAccount=true\n
