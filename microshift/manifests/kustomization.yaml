# MicroShift renders this at first start. nvidia-device-plugin.yml is not in
# this directory in git — the Containerfile curls it from the device plugin
# release, so the upstream manifest is never forked, only patched.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - nvidia-device-plugin.yml
  - nvidia-device-plugin-config.yaml
patches:
  - path: nvidia-device-plugin-time-slicing.yaml
