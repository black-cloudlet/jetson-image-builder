# Strategic-merge patch over the upstream static manifest, applied by the
# kustomization in /etc/microshift/manifests.
#
# A patch rather than a hand-written DaemonSet: the manifest is curl'd from the
# device plugin release, and a local copy would drift from it silently at the
# next version bump. Kustomize merges containers by name, env by name,
# volumeMounts by mountPath and volumes by name, so upstream's
# FAIL_ON_INIT_ERROR, its securityContext and its device-plugin hostPath all
# survive — the smoke test renders this and checks that they did.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: nvidia-device-plugin-ctr
          # CONFIG_FILE is the plugin's own env var for --config-file. Command
          # line and environment win over the file, so nothing else here may set
          # a flag the config also sets.
          env:
            - name: CONFIG_FILE
              value: /etc/nvidia-device-plugin/config.yaml
          volumeMounts:
            - name: device-plugin-config
              mountPath: /etc/nvidia-device-plugin
      volumes:
        - name: device-plugin-config
          configMap:
            name: nvidia-device-plugin-config
