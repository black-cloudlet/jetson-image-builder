# kserve.yaml is not in git: the Containerfile curls it in, pinned by
# KSERVE_VER. Patched from here, never forked — it is 7 MB, most of it CRDs.
#
# Only kserve-controller-manager runs. It serves every webhook this node uses
# (InferenceService defaulting and validation, the ClusterServingRuntime
# validator, the pod mutator that injects the model), and the three deleted
# workloads are separate binaries for features nothing here creates. Their
# CRDs, Services and webhook configurations stay: those webhooks match only
# their own kinds, so with no backend they refuse only what is not installed.
#
# One patch per file and one resource per patch, for the reason given in
# 010-cert-manager's kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - kserve.yaml
# newName without newTag keeps the tag the release pinned. An entry that stops
# matching is a silent no-op, unlike the patches, so the smoke test rejects a
# render that still names an unqualified image.
images:
  - name: kserve/kserve-controller
    newName: docker.io/kserve/kserve-controller
patches:
  - path: inferenceservice-config.yaml
  - path: storage-container.yaml
  - path: controller.yaml
  - path: delete-llmisvc-controller.yaml
  - path: delete-localmodel-controller.yaml
  - path: delete-localmodelnode-agent.yaml
