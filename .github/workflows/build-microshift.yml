# base -> bound-images -> microshift -> services -> ISO. Each layer builds on
# the previous one's digest, so a change to a service image does not re-pull
# MicroShift's control plane and vice versa. The ISO is built from the top of
# the chain, which is services, not microshift.
name: microshift image + installer ISO

on:
  push:
    branches: [main]
    paths:
      - base/**
      - microshift/**
      - services/**
      - .github/workflows/build-microshift.yml
      - .github/workflows/build-image.yml
      - .github/workflows/build-iso.yml
  workflow_dispatch:

jobs:
  # The pinned vendor image, republished. Shared by every variant.
  base:
    uses: ./.github/workflows/build-image.yml
    with:
      name: base
      containerfile: base/Containerfile.base
      smoke-test: base/smoke-test.base.sh
    secrets: inherit
    permissions: { contents: read, packages: write }

  # The image-embedding machinery. Shared by every variant.
  # Job id with an underscore, image name with a hyphen: needs.bound-images
  # parses as a subtraction, so a dotted reference to a hyphenated id resolves
  # to nothing instead of failing.
  bound_images:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      name: bound-images
      containerfile: base/Containerfile.podman
      smoke-test: base/smoke-test.podman.sh
      build-args: BASE_IMAGE=${{ needs.base.outputs.image-ref }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  microshift:
    needs: bound_images
    uses: ./.github/workflows/build-image.yml
    with:
      name: microshift
      containerfile: microshift/Containerfile
      smoke-test: microshift/smoke-test.sh
      build-args: BASE_IMAGE=${{ needs.bound_images.outputs.image-ref }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  # What runs on the cluster — cert-manager, KServe, the Triton runtime — on top
  # of the cluster layer rather than under it, so a service or a model changing
  # does not re-run the MicroShift install.
  services:
    needs: microshift
    uses: ./.github/workflows/build-image.yml
    with:
      name: services
      containerfile: services/Containerfile
      smoke-test: services/smoke-test.sh
      build-args: BASE_IMAGE=${{ needs.microshift.outputs.image-ref }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  # The ISO is still the microshift variant's: config.toml and the artifact name
  # belong to the variant, the image installed is the top of its chain.
  iso:
    needs: services
    uses: ./.github/workflows/build-iso.yml
    with:
      image-ref: ${{ needs.services.outputs.image-ref }}
      config: microshift/config.toml
      name: microshift
      tag: ${{ needs.services.outputs.tag }}
    secrets: inherit
    permissions: { contents: read, packages: read }
