# A regular UID, like any desktop user GDM logs in; above the kickstart's
# cloudlet (1000). The kickstart creates kiosk first, with this UID and the
# password from JETSON_KIOSK_PASSWORD_HASH, so on an installed node this line
# does nothing. A node that never ran that kickstart gets kiosk from here,
# locked, until someone runs `passwd kiosk`.
u kiosk 1500 "Kiosk" /var/home/kiosk /bin/bash
