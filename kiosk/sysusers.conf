# A regular UID, like any desktop user GDM logs in; above the kickstart's
# cloudlet (1000). The password is locked: nobody logs in as kiosk but GDM.
u kiosk 1500 "Kiosk" /var/home/kiosk /bin/bash
# NVIDIA's GPU nodes (nvmap, nvhost-*, nvgpu) are root:video 0660 by the
# vendor's 99-tegra-devices.rules, outside logind's seat access: without video,
# GNOME Kiosk and Firefox cannot open the GPU.
m kiosk video
