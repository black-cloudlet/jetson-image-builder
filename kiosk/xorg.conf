# modesetting rather than NVIDIA's DDX, with glamor off: X itself never touches
# the GPU, and its GLX can then only offer Mesa's software renderer. Any KMS
# driver with dumb buffers will do, so this does not depend on what NVIDIA user
# space the base image carries. If X picks the wrong /dev/dri card on the
# device, add Option "kmsdev" here.
Section "Device"
	Identifier "jetson-kiosk"
	Driver "modesetting"
	Option "AccelMethod" "none"
EndSection

# No Ctrl-Alt-Fn: the other VTs hold a login prompt and nothing else a kiosk
# user needs. Administration is over SSH.
Section "ServerFlags"
	Option "DontVTSwitch" "true"
EndSection
