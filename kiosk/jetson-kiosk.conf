# The page the kiosk opens; sourced by gnome-kiosk-script. A placeholder until
# the app team names the frontend's Route host. Since the kickstart's %post
# (which mapped jetson-1 to 10.44.0.1 in /etc/hosts) was dropped, this name
# resolves only through the network's DNS: with the cable out the script waits
# at its URL check. The real host must resolve offline. Over https, the CA that
# signs the frontend must be in /etc/pki/ca-trust/source/anchors: RHEL's
# Firefox reads the system trust.
KIOSK_URL=http://jetson-1.cloudlet.local/
