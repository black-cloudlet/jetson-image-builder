name: bootc image + installer ISO

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - config.toml
      - physically-bound-images/**
      - .github/workflows/build-bootc.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jetson-orin-bootc

# Both jobs run on an Ubuntu runner but do all their work inside a UBI
# container: podman/buildah/skopeo come from RHEL rather than Ubuntu's archive,
# and `subscription-manager register` inside the container gives entitlement for
# the MicroShift RPMs and bib's Anaconda depsolve. Pattern from
# redhat-et/edge-ai-image-pipelines (Apache-2.0).
#
# --device /dev/nvme0n1 is the runner's scratch disk. Embedding ~10 GB of
# container images and then building an ISO does not fit in the container's
# default writable layer, so /var/lib/containers and /var/tmp are moved onto it.

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: write }
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged --device /dev/nvme0n1
    env:
      # Use this container's own registration, not the (unsubscribed) host's.
      SMDEV_CONTAINER_OFF: 1
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Container tools
        run: dnf -y install podman buildah skopeo jq

      # UBI's default policy demands signatures for registry.redhat.io content.
      - name: Relax image signature policy in the builder
        run: |
          jq 'del(.transports)' /etc/containers/policy.json > /tmp/policy.json
          mv /tmp/policy.json /etc/containers/policy.json

      - name: Register with Red Hat
        run: subscription-manager register --org="${{ secrets.RHT_ORGID }}" --activationkey="${{ secrets.RHT_ACT_KEY }}"

      - name: Move container storage onto the scratch disk
        run: |
          if findmnt -S /dev/nvme0n1 >/dev/null 2>&1; then
            echo "::warning::/dev/nvme0n1 already mounted; leaving it alone. The build may run out of space."
            exit 0
          fi
          dnf -y install xfsprogs
          mkfs.xfs -f /dev/nvme0n1
          mkdir -p /var/mnt && mount /dev/nvme0n1 /var/mnt
          mkdir -p /var/mnt/containers /var/mnt/tmp /var/lib/containers /var/tmp
          mount --bind /var/mnt/containers /var/lib/containers
          mount --bind /var/mnt/tmp /var/tmp
          df -h /var/lib/containers /var/tmp

      - name: Compute tag
        id: meta
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pulls MicroShift's and the device plugin's images at build time; never
      # written into the OS image.
      - name: Write pull secret
        env:
          PULL_SECRET: ${{ secrets.OPENSHIFT_PULL_SECRET }}
        run: |
          install -m 600 /dev/null /tmp/pull-secret.json
          printf '%s' "$PULL_SECRET" > /tmp/pull-secret.json
          jq -e '.auths | length > 0' /tmp/pull-secret.json > /dev/null \
            || { echo "::error::OPENSHIFT_PULL_SECRET is not a pull secret with an .auths object"; exit 1; }

      - name: Build
        run: |
          podman build \
            --secret id=pullsecret,src=/tmp/pull-secret.json \
            -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:latest" -f Containerfile .

      - name: Smoke test
        run: |
          podman run --rm "$IMAGE:${{ steps.meta.outputs.tag }}" bash -c '
            set -eu
            bootc --version
            cat /etc/nv_tegra_release
            rpm -q nvidia-jetpack-for-rhel-9.8-kmod nvidia-container-toolkit-base
            ls /usr/lib/modules/*/extra/drivers/gpu/nvgpu/nvgpu.ko
            rpm -q microshift microshift-release-info
            test -L /etc/systemd/system/multi-user.target.wants/microshift.service
            test -L /etc/systemd/system/multi-user.target.wants/microshift-make-rshared.service
            test -L /etc/systemd/system/multi-user.target.wants/copy-embedded-images.service
            test -s /etc/microshift/manifests/nvidia-device-plugin.yml
            test -s /etc/microshift/manifests/kustomization.yaml
            test -f /etc/crio/crio.conf.d/99-nvidia.conf
            test -s /usr/lib/containers-image-cache/mapping.txt
            echo "embedded images: $(wc -l < /usr/lib/containers-image-cache/mapping.txt)"
            while IFS=, read -r img sha; do
              test -f "/usr/lib/containers-image-cache/${sha}/manifest.json" \
                || { echo "missing embedded image: ${img}"; exit 1; }
            done < /usr/lib/containers-image-cache/mapping.txt
            grep -q nvidia /usr/lib/containers-image-cache/mapping.txt'

      - name: Push
        run: podman push "$IMAGE:${{ steps.meta.outputs.tag }}" && podman push "$IMAGE:latest"

      - name: Unregister
        if: always()
        run: subscription-manager unregister || true

  # Turn the pushed image into an unattended Anaconda installer ISO. bib runs
  # nested inside the UBI builder, so it needs --privileged and, unlike on an
  # Ubuntu host, the SELinux opt-out.
  iso:
    needs: image
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: read }
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged --device /dev/nvme0n1
    env:
      SMDEV_CONTAINER_OFF: 1
    steps:
      - uses: actions/checkout@v4

      - name: Container tools
        run: dnf -y install podman skopeo jq

      - name: Relax image signature policy in the builder
        run: |
          jq 'del(.transports)' /etc/containers/policy.json > /tmp/policy.json
          mv /tmp/policy.json /etc/containers/policy.json

      - name: Register with Red Hat
        run: subscription-manager register --org="${{ secrets.RHT_ORGID }}" --activationkey="${{ secrets.RHT_ACT_KEY }}"

      - name: Move container storage and ISO output onto the scratch disk
        run: |
          if findmnt -S /dev/nvme0n1 >/dev/null 2>&1; then
            echo "::warning::/dev/nvme0n1 already mounted; leaving it alone. The build may run out of space."
            mkdir -p output
            exit 0
          fi
          dnf -y install xfsprogs
          mkfs.xfs -f /dev/nvme0n1
          mkdir -p /var/mnt && mount /dev/nvme0n1 /var/mnt
          mkdir -p /var/mnt/containers /var/mnt/tmp /var/mnt/output /var/lib/containers /var/tmp output
          mount --bind /var/mnt/containers /var/lib/containers
          mount --bind /var/mnt/tmp /var/tmp
          mount --bind /var/mnt/output output
          df -h /var/lib/containers /var/tmp output

      - name: Logins
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}"      | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.RH_REGISTRY_TOKEN }}" | podman login registry.redhat.io -u "${{ secrets.RH_REGISTRY_USER }}" --password-stdin

      - name: Render config.toml
        run: |
          sed -e 's|@EDGE_SSH_PUBKEY@|${{ secrets.EDGE_SSH_PUBKEY }}|' \
              -e 's|@EDGE_PASSWORD_HASH@|${{ secrets.EDGE_PASSWORD_HASH }}|' config.toml > /tmp/config.toml
          ! grep -q '@EDGE_' /tmp/config.toml

      - name: Build ISO
        run: |
          podman pull "$IMAGE:${{ needs.image.outputs.tag }}"
          podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /tmp/config.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            registry.redhat.io/rhel9/bootc-image-builder:latest \
            --type anaconda-iso --config /config.toml \
            "$IMAGE:${{ needs.image.outputs.tag }}"
          mv output/bootiso/install.iso "output/jetson-orin-bootc-${{ needs.image.outputs.tag }}.iso"
          (cd output && sha256sum ./*.iso > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: jetson-orin-bootc-iso-${{ needs.image.outputs.tag }}
          path: |
            output/*.iso
            output/SHA256SUMS
          retention-days: 7
          compression-level: 0

      - name: Unregister
        if: always()
        run: subscription-manager unregister || true
