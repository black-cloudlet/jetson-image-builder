# The ConfigMap write that flag needs. Subject `default`, as upstream's: the
# `namespace:` line moves it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-generic-targets
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-generic-targets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-generic-targets
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: default
