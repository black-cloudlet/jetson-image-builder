# The page the kiosk opens. A placeholder until the app team names the
# frontend's Route host. jetson-1.cloudlet.local is 10.44.0.1, the node IP on
# lo, in /etc/hosts (the kickstart's %post), so it resolves with no DNS and
# survives an unplugged cable. Over https, the CA that signs the frontend must
# be in /etc/pki/ca-trust/source/anchors: RHEL's Firefox reads the system
# trust.
KIOSK_URL=http://jetson-1.cloudlet.local/
