# base -> apps -> k3s -> ISO. The k3s variant of build-microshift.yml: it reuses
# base and apps untouched, so only the last two jobs differ.
#
# ON HOLD: manual dispatch only, no push trigger. The variant is unvalidated on
# hardware and base/** and apps/** match both callers, so every change below the
# control plane used to rebuild and re-push those two layers a second time and
# then pull a whole k3s control plane nobody is booting yet. Nothing is deleted:
# `workflow_dispatch` still builds the full chain on demand, and copying the
# `push:` block from build-microshift.yml (with k3s/** in its paths) turns
# automatic builds back on.
name: k3s image + installer ISO

on:
  workflow_dispatch:

jobs:
  # Republishes the pinned vendor image.
  base:
    uses: ./.github/workflows/build-image.yml
    with:
      name: base
      containerfile: base/Containerfile
      smoke-test: base/smoke-test.sh
    secrets: inherit
    permissions: { contents: read, packages: write }

  # Embedding machinery and app images. Shared by every variant.
  apps:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      name: apps
      containerfile: apps/Containerfile
      smoke-test: apps/smoke-test.sh
      build-args: BASE_IMAGE=${{ needs.base.outputs.image-ref }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  k3s:
    needs: apps
    uses: ./.github/workflows/build-image.yml
    with:
      name: k3s
      containerfile: k3s/Containerfile
      smoke-test: k3s/smoke-test.sh
      build-args: BASE_IMAGE=${{ needs.apps.outputs.image-ref }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  iso:
    needs: k3s
    uses: ./.github/workflows/build-iso.yml
    with:
      image-ref: ${{ needs.k3s.outputs.image-ref }}
      config: k3s/config.toml
      name: k3s
      tag: ${{ needs.k3s.outputs.tag }}
    secrets: inherit
    permissions: { contents: read, packages: read }
