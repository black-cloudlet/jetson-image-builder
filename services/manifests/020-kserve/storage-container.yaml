# The storage initializer KServe injects as an init container for every
# InferenceService whose storageUri it has to fetch. Fully qualified for the
# reason given in inferenceservice-config.yaml; nothing else here is changed,
# and the images: transformer cannot reach it — spec/container/image is not one
# of the pod-spec paths kustomize rewrites.
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: default
  namespace: kserve
spec:
  container:
    name: storage-initializer
    image: docker.io/kserve/storage-initializer:v0.20.0
