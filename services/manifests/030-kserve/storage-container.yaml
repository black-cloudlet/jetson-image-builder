# The storage initializer KServe injects to download a model from s3://, hf://
# or http(s)://. Nothing here uses it — a model arrives as oci:// (a modelcar)
# or pvc:// — but it is the fallback, so it is made to fit anyway: fully
# qualified, because CRI-O resolves a short name through the search registries
# instead of the local store, and resources at memory 1:1, CPU 1:4.
# The images: transformer cannot reach spec.container.image, a path kustomize
# does not know is an image. The tag must match the controller's; the smoke
# test checks every docker.io/kserve image shares one.
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: default
  namespace: kserve
spec:
  container:
    name: storage-initializer
    image: docker.io/kserve/storage-initializer:v0.20.0
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
