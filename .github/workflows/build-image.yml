# Reusable: build one layer and push it to GHCR. Context is the repository root
# so any layer can COPY shared tooling.
#
# Ubuntu runner for native aarch64, all work inside a UBI container so
# podman/skopeo come from RHEL and subscription-manager can supply entitlement.
# GitHub offers no RHEL-hosted runner.
name: build bootc image

on:
  workflow_call:
    inputs:
      name:
        description: image suffix; publishes ghcr.io/<owner>/jetson-orin-bootc-<name>
        type: string
        required: true
      containerfile:
        type: string
        required: true
      smoke-test:
        description: script run inside the built image, on stdin, before pushing
        type: string
        required: true
      build-args:
        description: newline-separated KEY=VALUE pairs
        type: string
        default: ""
      extra-tags:
        description: |
          moving tags pushed alongside <date>-<sha8> and latest, whitespace
          separated. All of them point at the same digest.
        type: string
        default: ""
      runs-on:
        description: runner label; must be native aarch64
        type: string
        default: ubuntu-24.04-arm
    outputs:
      image-ref:
        description: pushed image pinned by digest
        value: ${{ jobs.build.outputs.image-ref }}
      tag:
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read, packages: write }
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
      # The runner's ephemeral disk: ~10 GB of embedded images does not fit in
      # the job container's writable layer.
      volumes:
        - /mnt:/scratch
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jetson-orin-bootc-${{ inputs.name }}
      # Use this container's registration, not the (unsubscribed) host's.
      SMDEV_CONTAINER_OFF: 1
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Container tools
        run: dnf -y install podman buildah skopeo jq

      # UBI's default policy demands signatures for registry.redhat.io content.
      - name: Relax image signature policy in the builder
        run: |
          jq 'del(.transports)' /etc/containers/policy.json > /tmp/policy.json
          mv /tmp/policy.json /etc/containers/policy.json

      # Every job registers, including the layers that install no RPMs: the
      # variant layers need the RHEL and rhocp repos, and one code path for all
      # of them beats a per-layer flag.
      - name: Register with Red Hat
        env:
          RHSM_USERNAME: ${{ secrets.RHSM_USERNAME }}
          RHSM_PASSWORD: ${{ secrets.RHSM_PASSWORD }}
        run: subscription-manager register --username="$RHSM_USERNAME" --password="$RHSM_PASSWORD"

      # podman must end up on native overlay with the native diff, or every
      # layer commit walks the whole rootfs (~2 min each). The job container's
      # / is overlayfs, unusable as an upperdir, hence the bind onto /scratch,
      # the runner's ext4 disk.
      - name: Put container storage on the runner's disk
        run: |
          mkdir -p /scratch/containers /scratch/tmp /var/lib/containers /var/tmp
          mount --bind /scratch/containers /var/lib/containers
          mount --bind /scratch/tmp /var/tmp
          df -h /var/lib/containers
          # RHEL's storage.conf mounts overlay with metacopy=on, and the runner
          # kernel defaults redirect_dir on; either one makes the storage library
          # refuse the native diff. Set the options before podman first runs.
          sed -i '/^mountopt = /s/=.*/= "nodev,redirect_dir=off"/' /etc/containers/storage.conf
          grep -n '^mountopt' /etc/containers/storage.conf || true
          grep -H . /sys/module/overlay/parameters/* || true
          podman info --format '{{.Store.GraphDriverName}} {{.Store.GraphStatus}}' | tee /tmp/graph
          grep -q 'Native Overlay Diff:true' /tmp/graph \
            || { echo "::error::podman is not on native overlay; layer commits will take minutes each"; exit 1; }

      # One immutable tag, then whatever moving ones the caller asked for. The
      # immutable one is what a node is rolled back to and what the mirror keeps;
      # the moving ones are what something upgrading follows.
      - name: Compute tags
        id: meta
        env:
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          # Unquoted on purpose: splits on any whitespace, newlines included.
          tags="$(echo $tag latest $EXTRA_TAGS)"
          # Before the build rather than after it: a tag podman rejects should
          # not cost twenty minutes first.
          for t in $tags; do
            case $t in
              [A-Za-z0-9_]*) ;;
              *) echo "::error::not a usable image tag: ${t}"; exit 1 ;;
            esac
            case $t in
              *[!A-Za-z0-9._-]*) echo "::error::not a usable image tag: ${t}"; exit 1 ;;
            esac
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "building $IMAGE with tags: $tags"

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Build-time only; never written into the OS image.
      - name: Write pull secret
        env:
          PULL_SECRET: ${{ secrets.OPENSHIFT_PULL_SECRET }}
        run: |
          install -m 600 /dev/null /tmp/pull-secret.json
          printf '%s' "$PULL_SECRET" > /tmp/pull-secret.json
          jq -e '.auths | length > 0' /tmp/pull-secret.json > /dev/null \
            || { echo "::error::OPENSHIFT_PULL_SECRET is not a pull secret with an .auths object"; exit 1; }

      - name: Build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            args+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"
          for t in $TAGS; do
            args+=(-t "$IMAGE:$t")
          done
          podman build "${args[@]}" \
            --secret id=pullsecret,src=/tmp/pull-secret.json \
            -f "${{ inputs.containerfile }}" .

      - name: Smoke test
        run: podman run --rm -i "$IMAGE:${{ steps.meta.outputs.tag }}" bash -s < "${{ inputs.smoke-test }}"

      # Downstream layers consume the digest, not the tag. Every tag names the
      # same manifest, so the digest is taken from the first push and the rest
      # only move a name onto it.
      - name: Push
        id: push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          podman push --digestfile=/tmp/digest "$IMAGE:$TAG"
          for t in $TAGS; do
            [ "$t" = "$TAG" ] && continue
            podman push "$IMAGE:$t"
          done
          echo "image-ref=${IMAGE}@$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Unregister
        if: always()
        run: subscription-manager unregister || true
