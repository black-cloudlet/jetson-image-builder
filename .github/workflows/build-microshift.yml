# MicroShift variant: base -> apps -> microshift -> installer ISO.
# Each layer is pushed separately and the next builds on its digest, so a change
# to an application image does not re-pull MicroShift's control plane, and a
# MicroShift change does not re-pull the application images.
name: microshift image + installer ISO

on:
  push:
    branches: [main]
    paths:
      - base/**
      - apps/**
      - microshift/**
      - physically-bound-images/**
      - .github/workflows/build-microshift.yml
      - .github/workflows/build-image.yml
      - .github/workflows/build-iso.yml
  workflow_dispatch:

jobs:
  # Republishes the pinned vendor image under our own name. Adds nothing, runs
  # no dnf, so no subscription slot is consumed.
  base:
    uses: ./.github/workflows/build-image.yml
    with:
      name: base
      containerfile: base/Containerfile
      smoke-test: base/smoke-test.sh
      needs-entitlement: false
    secrets: inherit
    permissions: { contents: read, packages: write }

  # Embedding machinery and application images. Shared by every variant, and
  # likewise no dnf.
  apps:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      name: apps
      containerfile: apps/Containerfile
      smoke-test: apps/smoke-test.sh
      build-args: BASE_IMAGE=${{ needs.base.outputs.image-ref }}
      needs-entitlement: false
    secrets: inherit
    permissions: { contents: read, packages: write }

  microshift:
    needs: apps
    uses: ./.github/workflows/build-image.yml
    with:
      name: microshift
      containerfile: microshift/Containerfile
      smoke-test: microshift/smoke-test.sh
      build-args: BASE_IMAGE=${{ needs.apps.outputs.image-ref }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  iso:
    needs: microshift
    uses: ./.github/workflows/build-iso.yml
    with:
      image-ref: ${{ needs.microshift.outputs.image-ref }}
      config: microshift/config.toml
      name: microshift
      tag: ${{ needs.microshift.outputs.tag }}
    secrets: inherit
    permissions: { contents: read, packages: read }
