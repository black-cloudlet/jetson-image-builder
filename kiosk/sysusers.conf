# A regular UID, like any user GDM logs in. The password is set only at
# creation, so `passwd kiosk` on a node stays.
u kiosk 1500 "Kiosk" /var/home/kiosk /bin/bash
# NVIDIA's GPU nodes (nvmap, nvhost-*, nvgpu/*) are root:video 0660: the login
# screen and the session draw through them.
m gdm   video
m kiosk video
