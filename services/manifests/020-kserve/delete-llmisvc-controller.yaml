# Pins runAsUser: 1000, which restricted-v2 rejects outright: the SCC assigns a
# UID out of the namespace's openshift.io/sa.scc.uid-range (allocated by
# MicroShift's cluster-policy-controller, ~1000650000/10000) and 1000 is never
# inside it. It reconciles LLMInferenceServices, which an image-recognition
# node does not create.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmisvc-controller-manager
  namespace: kserve
$patch: delete
