# Resources, memory 1:1 and CPU 1:4. Upstream breaks both ratios on the
# manager and sets none on kube-rbac-proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kserve-controller-manager
  namespace: kserve
spec:
  template:
    spec:
      containers:
        - name: manager
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              cpu: 400m
              memory: 300Mi
        - name: kube-rbac-proxy
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 40m
              memory: 64Mi
