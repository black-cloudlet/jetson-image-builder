# The page the kiosk opens; sourced by gnome-kiosk-script. A placeholder until
# the app team names the frontend's Route host. Nothing maps this name to an
# address any more (the kickstart's /etc/hosts line went with its %post), and
# the real one must resolve with the cable out, when 192.168.1.1 is gone, or
# the script waits on it forever. Over https, the CA that signs the frontend
# must be in /etc/pki/ca-trust/source/anchors: RHEL's Firefox reads the
# system trust.
KIOSK_URL=http://jetson-1.cloudlet.local/
