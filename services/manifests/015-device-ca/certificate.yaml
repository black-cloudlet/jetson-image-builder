# In cert-manager because a ClusterIssuer reads its Secret from the controller's
# --cluster-resource-namespace. The Secret holds tls.key; 025 copies tls.crt only.
# rotationPolicy: Never keeps the key on renewal, so existing leaves and stale
# bundles still verify; cert-manager's default became Always in v1.18.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: device-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Cloudlet device CA
  subject:
    organizations:
      - Cloudlet
  secretName: device-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: device-ca-bootstrap
