# bib config for --type anaconda-iso; @EDGE_SSH_PUBKEY@ and @EDGE_PASSWORD_HASH@ are sed'd in by the workflow.
[customizations.installer.kickstart]
contents = """
text --non-interactive
lang en_US.UTF-8
keyboard us
timezone Asia/Jerusalem --utc

# Static: two devices imaged from one ISO collide on a segment.
network --bootproto=static --ip=192.168.1.10 --netmask=255.255.255.0 --gateway=192.168.1.1 --device=link --onboot=on --activate --hostname=Jetson

# On-board eMMC only; 40 GiB root, no swap, the rest of the VG left free for MicroShift's LVMS.
ignoredisk --only-use=mmcblk0
zerombr
clearpart --all --initlabel --disklabel=gpt
reqpart --add-boot
part pv.01 --size=1 --grow
volgroup rhel pv.01
logvol / --vgname=rhel --name=root --size=40960 --fstype=xfs

rootpw --lock
user --name=edge --groups=wheel --iscrypted --password=@EDGE_PASSWORD_HASH@
sshkey --username=edge "@EDGE_SSH_PUBKEY@"

reboot --eject
"""

[customizations.iso]
volume_id = "JETSON_ORIN_BOOTC"
