# bib config for --type anaconda-iso; @JETSON_SSH_PUBKEY@ and @JETSON_PASSWORD_HASH@ are substituted by the workflow.
[customizations.installer.kickstart]
contents = """
text --non-interactive
lang en_US.UTF-8
keyboard us
timezone Asia/Jerusalem --utc

# Static: two devices imaged from one ISO collide on a segment.
network --bootproto=static --ip=192.168.1.10 --netmask=255.255.255.0 --gateway=192.168.1.254 --nameserver=192.168.1.1 --device=eth0 --onboot=on --domain=cloudlet.local --activate --hostname=jetson-1

# On-board eMMC only; 40 GiB root, no swap, the rest of the VG left free for MicroShift's LVMS.
ignoredisk --only-use=mmcblk0
zerombr
clearpart --all --initlabel --disklabel=gpt
reqpart --add-boot
part pv.01 --size=1 --grow
volgroup rhel pv.01
logvol / --vgname=rhel --name=root --size=40960 --fstype=xfs

rootpw --lock
user --name=cloudlet --groups=wheel --iscrypted --password=@JETSON_PASSWORD_HASH@
sshkey --username=cloudlet "@JETSON_SSH_PUBKEY@"

reboot --eject

# Per device, so it lives beside --hostname/--domain above and repeats them.
# /etc/hosts: the node resolves its own name with 192.168.1.1 out of reach, on
# the lo address MicroShift runs on. subjectAltNames: the name only, no IP, so
# the laptop reaches 6443 through DNS and the address stays in the network line.
%post
echo "10.44.0.1 jetson-1.cloudlet.local jetson-1" >> /etc/hosts
cat > /etc/microshift/config.d/20-subject-alt-names.yaml <<'EOF'
apiServer:
  subjectAltNames:
    - jetson-1.cloudlet.local
EOF
%end
"""

[customizations.iso]
volume_id = "JETSON_ORIN_BOOTC"
