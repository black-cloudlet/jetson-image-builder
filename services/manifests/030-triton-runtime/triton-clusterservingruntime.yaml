# The one model server on this node: NVIDIA Triton, on Tegra's integrated GPU.
#
# Upstream ships a kserve-tritonserver runtime in kserve-cluster-resources.yaml,
# but that file also carries thirteen others — huggingface, vllm, torchserve,
# mlserver, tensorflow/serving — and every image any of them names would have to
# be embedded for a node that never pulls. So the runtime is ours and that file
# is not applied. It is upstream's spec otherwise, changed where the Jetson and
# MicroShift demand it:
#
#   - the -igpu image. NVIDIA builds Triton for Tegra's iGPU as a separate tag;
#     the plain -py3 image is built for discrete GPUs and finds none here.
#     The igpu line has to match the base image's L4T (r36.5.0, JetPack 6.2.x) —
#     confirm the tag exists on NGC and check its release notes before bumping.
#   - nvidia.com/gpu. Upstream's runtime requests no GPU at all, and the device
#     plugin only hands one out to a container that asks; without it Triton
#     starts on the CPU and inference is an order of magnitude slower. One
#     replica of the four the plugin publishes (time slicing, microshift layer).
#   - no runAsUser. Upstream pins 1000; restricted-v2 assigns a UID out of the
#     namespace's range and rejects a fixed one outside it.
#   - a memory limit the model has room in. On Tegra the GPU has no memory of
#     its own — CUDA allocations come out of the same 32 GB the cgroup accounts,
#     so upstream's 2Gi is a limit the CUDA context alone can approach. 4 GPU
#     time slices x 8Gi is the whole SOM, so this number and the plugin's
#     replica count come down together when a real model lands.
#
# tensorrt carries no version: upstream says 8, and JetPack 6.2 ships TensorRT
# 10. A plan file is specific to a TensorRT version and a GPU architecture
# anyway, so whatever lands in the model store has to be built by this JetPack's
# TensorRT, on an Orin.
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: triton-igpu
  annotations:
    serving.kserve.io/server-type: tritonserver
spec:
  annotations:
    prometheus.kserve.io/path: /metrics
    prometheus.kserve.io/port: "8002"
  protocolVersions:
    - v2
    - grpc-v2
  supportedModelFormats:
    - name: tensorrt
      autoSelect: true
      priority: 1
    - name: onnx
      version: "1"
      autoSelect: true
      priority: 1
    - name: tensorflow
      version: "1"
      autoSelect: true
      priority: 1
    - name: tensorflow
      version: "2"
      autoSelect: true
      priority: 1
    - name: pytorch
      version: "1"
    - name: triton
      version: "2"
      autoSelect: true
      priority: 1
  containers:
    - name: kserve-container
      image: nvcr.io/nvidia/tritonserver:25.02-py3-igpu
      args:
        - tritonserver
        - --model-store=/mnt/models
        - --grpc-port=9000
        - --http-port=8080
        - --allow-grpc=true
        - --allow-http=true
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
