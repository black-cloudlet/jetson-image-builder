# sysusers rather than useradd: /etc/passwd goes through bootc's three-way /etc
# merge, and a user added there in the image can be lost or collide on upgrade.
# The home is the unit's StateDirectory=, created at start with this owner.
u kiosk - "Kiosk display session" /var/lib/jetson-kiosk /usr/sbin/nologin
