# A root of its own, applied after 020-: a ClusterServingRuntime needs both the
# CRD and the validating webhook that admits it, and both come from the KServe
# install next door. MicroShift retries a root every 10s for 10 minutes, which
# is what bridges CRD-applied-there to CRD-established-and-webhook-serving-here.
#
# Deleting this directory is how the node is built without Triton: the build
# embeds what the manifests name, so the image goes with it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - triton-clusterservingruntime.yaml
