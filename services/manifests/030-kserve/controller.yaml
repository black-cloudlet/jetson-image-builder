# Resources, memory 1:1 and CPU 1:4. Upstream breaks both ratios on the
# manager and sets none on kube-rbac-proxy.
# Upstream also sets imagePullPolicy: Always on the manager, so the kubelet
# asks the registry even with the image in containers-storage: ErrImagePull
# on a node with no network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kserve-controller-manager
  namespace: kserve
spec:
  template:
    spec:
      containers:
        - name: manager
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              cpu: 400m
              memory: 300Mi
        - name: kube-rbac-proxy
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 40m
              memory: 64Mi
