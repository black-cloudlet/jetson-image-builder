# Upstream installs into `default` and ships no namespace of its own;
# cert-manager, in 010, ships one. Everything else in this root is moved into
# this one by the kustomization's `namespace:` line. Kustomize sorts a
# Namespace to the front of the render, so the one apply creates it first. No
# SCC uid-range annotation: cluster-policy-controller allocates that.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
