# kserve.yaml is not in git: the Containerfile curls it in, pinned by
# KSERVE_VER. Patched from here, never forked — it is 7 MB of CRDs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - kserve.yaml
# newName without a newTag rewrites the registry and keeps whatever tag the
# release pinned, so bumping KSERVE_VER is not repeated here. kube-rbac-proxy
# is already qualified upstream (quay.io/brancz). An entry that stops matching
# is a silent no-op, unlike the patches below, so the smoke test rejects a
# render that still names an unqualified image.
images:
  - name: kserve/kserve-controller
    newName: docker.io/kserve/kserve-controller
# Three of upstream's four workloads are deleted rather than patched into
# admissibility: nothing on this node uses what they reconcile, and deleting
# them keeps their images out of the embedded cache as well — the build embeds
# every image the manifests name and /usr pays for each one. Each file says why
# its workload goes. Their CRDs, RBAC, Services, Certificates and webhook
# configurations stay: those webhooks gate only their own resources
# (llminferenceservices, llminferenceserviceconfigs, localmodelcaches), none of
# which is ever created here, so a webhook with no endpoint behind it fails
# nothing. One patch per file, one resource per patch: kustomize inside oc is
# older than the standalone tool and a multi-document patch file makes some of
# those versions panic. A patch that matches nothing fails the build, which is
# what catches a rename upstream.
patches:
  - path: inferenceservice-config.yaml
  - path: storage-container.yaml
  - path: delete-llmisvc-controller.yaml
  - path: delete-localmodel-controller.yaml
  - path: delete-localmodelnode-agent.yaml
