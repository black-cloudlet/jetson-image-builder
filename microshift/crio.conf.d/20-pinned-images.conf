# Keeps kubelet's image GC off embedded images: there is no registry to re-pull
# from. The boot-time prune still removes them (podman ignores CRI-O pins).
# The one list for every layer: a second drop-in would replace it, so a new
# registry an embedded image comes from goes here.
# Never pin a pulled image: nothing would ever delete it. That is why GHCR is
# pinned by repository, not whole: the OS images live there too, and anything
# later pulled from it would never be collected.
[crio.image]
pinned_images = [
	"docker.io/*",
	"ghcr.io/external-secrets/*",
	"nvcr.io/*",
	"quay.io/*",
	"registry.redhat.io/*",
]
