# Two changes, both forced by the node this runs on.
#
# runAsUser: null deletes the field upstream pins to 1000. restricted-v2
# rejects a pinned UID outright: the SCC assigns one out of the namespace's
# openshift.io/sa.scc.uid-range (allocated by MicroShift's
# cluster-policy-controller, ~1000650000/10000) and 1000 is never inside it, so
# the Deployment is admitted and then every pod it creates is refused. An
# explicit null in a strategic merge removes the key rather than setting it;
# runAsNonRoot: true is left in place, so the pod still cannot be given a root
# UID — the SCC only decides which non-root one.
#
# Resources for the reason given in 010-cert-manager/resources-controller.yaml:
# memory 1:1, CPU 1:4. Upstream asks for 10m/32Mi here and nothing at all on
# the other two, which on this node means a controller holding every synced
# Secret in cache inside a 32Mi request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: external-secrets
          securityContext:
            runAsUser: null
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi
